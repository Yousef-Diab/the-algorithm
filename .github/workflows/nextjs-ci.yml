name: nextjs-ci

# CI for the Next.js/Neon/Postgres migration (branch nextjs-neon-cms). This is
# additive to .github/workflows/ci.yml, which stays exactly as it is and keeps
# linting the legacy content/ + build.py + index.html source tree — that
# workflow is untouched by this file and will be retired separately, later,
# once content/ stops being authoritative.
#
# Two jobs, deliberately split:
#   - `unit`  runs with NO secrets at all, so a fork PR still gets the
#     import-fidelity gate and the gating logic checked (vitest.config.ts
#     substitutes a non-secret placeholder for DATABASE_URL when it's unset).
#   - `e2e`   needs real secrets (DB, auth, R2, a live test account) and is
#     gated to same-repo pushes/PRs so it never runs — and never fails — on a
#     fork PR where those secrets aren't available.

on:
  push:
  pull_request:

# Node 22 (current LTS "Jod"): --experimental-strip-types needs >=22.6, and
# --env-file-if-exists needs >=20.12/21.7 — Node 22 LTS satisfies both, and
# scripts/*.mjs (grant-entitlement.mjs, set-access.mjs) use both flags.
env:
  NODE_VERSION: "22"

jobs:
  unit:
    name: unit (no secrets)
    runs-on: ubuntu-latest
    # Deliberately no `env:` / `secrets:` here — this job must be runnable by
    # a fork PR with zero repo secrets available to it.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: e2e (secrets required)
    runs-on: ubuntu-latest
    # Skip on fork PRs, where secrets.* are unavailable to the workflow run —
    # never let this job fail loudly just because it has no credentials.
    if: github.event_name == 'push' || github.repository == github.event.pull_request.head.repo.full_name
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Grant E2E entitlement
        # Explicit step, separate from the test suite's own belt-and-braces
        # call in gating.authenticated.spec.ts, so a failure here reports as
        # "entitlement grant failed" rather than a mystifying test failure.
        # --env-file-if-exists is required: .env.local does not exist in CI,
        # and plain --env-file errors on a missing file.
        run: node --env-file-if-exists=.env.local --experimental-strip-types scripts/grant-entitlement.mjs "$E2E_EMAIL"

      - name: Clear stale Next.js build cache
        # next build reuses .next/cache across runs. This branch has already
        # hit a real bug from that: a rebuild kept serving a pre-flip catalog
        # after an access change until the cache was removed. Nothing is
        # prerendered today (the lesson route is force-dynamic), but any
        # future build-time read of mutable data has the same exposure — so
        # CI must never assume a warm cache is safe after a content mutation.
        run: rm -rf .next/cache

      - name: Build
        run: pnpm build

      - name: E2E tests
        # playwright.config.ts sets reuseExistingServer: !process.env.CI, so
        # Playwright starts its own `pnpm start` here — build and test MUST
        # run in this same job/runner, with the workspace preserved between
        # steps. Do not split these across jobs.
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
